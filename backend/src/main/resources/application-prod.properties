# Production Configuration
# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tatkal_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Admin login config
admin.username=${ADMIN_USERNAME:Admin}
admin.password=${ADMIN_PASSWORD:AdminMFP123}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server - Railway uses PORT environment variable
server.port=${PORT:8080}

# JWT Secret
jwt.secret=${JWT_SECRET:8yF9nK2mP4qR7vX3jL5hC1tW6bN9cD0aE3uI8oZ2xM4}

# PDF Output Directory
pdf.output.dir=${PDF_OUTPUT_DIR:./pdf-tokens}

# Logging
logging.level.root=INFO
logging.level.com.tokenbackend=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Connection pool settings for production
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000 